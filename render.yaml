services:
  # O nosso Robô do WhatsApp rodando ininterruptamente
  - type: web
    name: mini-crm-whatsapp-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build:whatsapp
    startCommand: npm run start:whatsapp
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_SESSION_DIR
        value: /tmp/whatsapp-session
      # Preencher no painel: DATABASE_URL, APP_ENCRYPTION_KEY,
      # OPENAI_API_KEY (opcional), CRM_OWNER_EMAIL e WHATSAPP_SERVICE_TOKEN.
